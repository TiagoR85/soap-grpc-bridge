syntax = "proto3";

option csharp_namespace = "SoapGrpcBridge.Contracts.Sefaz.Nfe.V1";

package sefaz.nfe.v1;

service NfeAuthorizationService {
  rpc AutorizarNfe(AutorizarNfeRequest) returns (AutorizarNfeResponse);
  rpc ConsultarStatusServico(ConsultarStatusServicoRequest) returns (ConsultarStatusServicoResponse);
}

message AutorizarNfeRequest {
  int32 cUF = 1;
  string idLote = 2;
  int32 tpAmb = 3;
  repeated string chaves = 4;
}

message AutorizarNfeResponse {
  string nRec = 1;
  string nProt = 2;
  int32 cStat = 3;
  string xMotivo = 4;
}

message ConsultarStatusServicoRequest {
  int32 cUF = 1;
  int32 tpAmb = 2;
}

message ConsultarStatusServicoResponse {
  int32 cStat = 1;
  string xMotivo = 2;
  string dhRecbto = 3;
  string versao = 4;
}
